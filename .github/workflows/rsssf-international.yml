name: International RSSSF source audit
on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/rsssf-historico-2026-10-31'
      - 'fix/identity-contextual-review-20261031'
    paths:
      - 'src/loteca_fivethirtyeight/international_rsssf.py'
      - 'src/loteca_fivethirtyeight/club_identity.py'
      - 'src/loteca_fivethirtyeight/contextual_identity.py'
      - 'src/loteca_fivethirtyeight/international_review_queue.py'
      - 'tests/test_identity_safety.py'
      - 'tests/test_international_rsssf.py'
      - 'src/loteca_fivethirtyeight/international_crosscheck.py'
      - 'src/loteca_fivethirtyeight/league_integrity.py'
      - 'tests/test_league_integrity.py'
      - 'auditoria/rsssf/competition_scoped_aliases.csv'
      - 'auditoria/rsssf/international_sources.csv'
      - '.github/workflows/rsssf-international.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python -m loteca_fivethirtyeight.international_rsssf auditoria/rsssf/international_sources.csv /tmp/international_rsssf
      - name: Audit all 2024-25 league fixtures and opponents
        run: |
          python -m loteca_fivethirtyeight.league_integrity /tmp/international_rsssf/international_matches.csv auditoria/rsssf/competition_scoped_aliases.csv /tmp/international_rsssf
      - name: Cross-check both canonical IDs with Caixa contests
        run: |
          python -m loteca_fivethirtyeight.international_crosscheck data/caixa_original /tmp/international_rsssf/international_matches.csv auditoria/rsssf/competition_scoped_aliases.csv /tmp/international_rsssf/international_source_audit.csv /tmp/international_rsssf/international_review.csv
      - name: Generate 79-candidate review queue (never auto-release)
        run: |
          python -m loteca_fivethirtyeight.international_review_queue /tmp/international_rsssf/international_review.csv /tmp/international_rsssf/international_review_triage.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-rsssf-evidence
          path: /tmp/international_rsssf/
          if-no-files-found: warn
