name: Testes Python

on:
  push:
    branches: [main, feature/importador-historico-loteca]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar projeto
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Testar sem acesso à rede
        run: python -m pytest
