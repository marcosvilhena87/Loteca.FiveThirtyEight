name: Auditoria externa Loteca
on:
  workflow_dispatch:
  push:
    branches: [feature/auditoria-externa-partidas]
    paths:
      - 'src/loteca_fivethirtyeight/external_audit.py'
      - 'tests/test_external_audit.py'
      - 'tests/test_identity.py'
      - 'src/loteca_fivethirtyeight/identity.py'
      - '.github/workflows/auditoria-externa.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar e testar
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_external_audit.py tests/test_identity.py
      - name: Gerar relatorio
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ -n "$SERPER_API_KEY" ]; then
            python -m loteca_fivethirtyeight.external_audit --output reports/auditoria_externa --max-searches 100 --pause 1.5
          else
            python -m loteca_fivethirtyeight.external_audit --output reports/auditoria_externa
          fi
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-loteca
          path: reports/auditoria_externa/
          if-no-files-found: warn
