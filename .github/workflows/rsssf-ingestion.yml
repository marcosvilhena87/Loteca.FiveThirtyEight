name: RSSSF ingestion and tests
on:
  push:
    branches: [audit/rsssf-concursos-0004-0100]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_rsssf_ingest_sources.py tests/test_rsssf_extract_rounds.py tests/test_rsssf_reconcile_auto.py tests/test_rsssf_diagnose_missing.py tests/test_rsssf_extract_knockouts.py tests/test_rsssf_contextual_clubs.py tests/test_rsssf_audit_candidates.py
  extract:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download RSSSF sources and validate integrity
        run: python -m audits.rsssf.ingest_sources --manifest audits/rsssf/sources_2002_2003.json --archive data/rsssf_archive
      - name: Reconcile 266 Caixa records with extracted seasons
        run: python -m audits.rsssf.run_reconciliation --archive data/rsssf_archive --caixa audits/rsssf/caixa_0032_0050.csv --aliases audits/rsssf/aliases_temporais.csv
      - name: Validate each candidate against canonical club IDs
        run: python -m audits.rsssf.audit_candidates --archive data/rsssf_archive --caixa audits/rsssf/caixa_0032_0050.csv --aliases audits/rsssf/aliases_temporais.csv
      - name: Audit Brazilian regular-season fixtures
        run: python -m audits.rsssf.audit_regular_2002 --archive data/rsssf_archive
      - name: Diagnose unresolved Caixa rows
        run: python -m audits.rsssf.diagnose_missing --archive data/rsssf_archive --caixa audits/rsssf/caixa_0032_0050.csv --aliases audits/rsssf/aliases_temporais.csv
      - name: Print unresolved cases for audit
        run: |
          python - <<'PY'
          import csv
          path="data/rsssf_archive/diagnostico_sem_candidato_0032_0050.csv"
          with open(path,encoding="utf-8-sig",newline="") as f:
            for r in csv.DictReader(f,delimiter=";"):
              print("EXCEPTION",r["concurso"],r["jogo"],r["mandante_caixa"],r["placar_caixa"],r["visitante_caixa"],r["categoria_provisoria"],r["evidencias_json"][:250])
          PY
      - name: Publish per-season integrity summary
        if: always()
        run: |
          if test -f data/rsssf_archive/integrity_report.json; then
            python -m json.tool data/rsssf_archive/integrity_report.json
          fi
      - name: Archive snapshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsssf-ingestion-2002-2003
          path: data/rsssf_archive/
          retention-days: 30
          if-no-files-found: warn
